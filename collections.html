<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">Nostra</div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="collections.html">Collections</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<div class="collection-container">

    <aside class="sidebar">

        <h3>Filters</h3>

        <label>
            <input type="checkbox" value="Men" class="filter">
            Men
        </label>

        <label>
            <input type="checkbox" value="Women" class="filter">
            Women
        </label>

        <label>
            <input type="checkbox" value="Kids" class="filter">
            Kids
        </label>

    </aside>

    <main class="main-content">

        <input
        type="text"
        id="search"
        placeholder="Search products...">

        <div class="products" id="productContainer">

            <div class="product-card" data-category="Men">
                <img src="https://picsum.photos/300?11">
                <h3>Men Shirt</h3>
                <p>₹899</p>
            </div>

            <div class="product-card" data-category="Women">
                <img src="https://picsum.photos/300?12">
                <h3>Women Kurti</h3>
                <p>₹1199</p>
            </div>

            <div class="product-card" data-category="Kids">
                <img src="https://picsum.photos/300?13">
                <h3>Kids T-Shirt</h3>
                <p>₹599</p>
            </div>

            <div class="product-card" data-category="Men">
                <img src="https://picsum.photos/300?14">
                <h3>Men Hoodie</h3>
                <p>₹1299</p>
            </div>

            <div class="product-card" data-category="Women">
                <img src="https://picsum.photos/300?15">
                <h3>Women Jacket</h3>
                <p>₹1499</p>
            </div>

            <div class="product-card" data-category="Kids">
                <img src="https://picsum.photos/300?16">
                <h3>Kids Hoodie</h3>
                <p>₹799</p>
            </div>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
